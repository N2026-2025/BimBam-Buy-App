version: "3.9"

services:
  api:
    build: .
    container_name: bimbam-buy-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma_db

  ui:
    build: .
    container_name: bimbam-buy-agent-ui
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma_db
    depends_on:
      - api

volumes:
  chroma_data:
