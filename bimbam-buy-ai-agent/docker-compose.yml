version: "3.9"

# Stack principal (API + UI). Para sumar observabilidad completa
# (Postgres + Prometheus + Grafana), correr junto con docker-compose.monitoring.yml:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up --build
# y setear en .env: MONITORING_DB_URL=postgresql+psycopg2://bimbam:bimbam@postgres:5432/bimbam_monitoring

services:
  api:
    build: .
    container_name: bimbam-buy-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma_db
      - monitoring_data:/app/monitoring_data

  ui:
    build: .
    container_name: bimbam-buy-agent-ui
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - chroma_data:/app/chroma_db
      - monitoring_data:/app/monitoring_data
    depends_on:
      - api

volumes:
  chroma_data:
  monitoring_data:
