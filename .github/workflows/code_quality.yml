name: CI - Calidad de Código y Seguridad
on:
  pull_request:
    branches: [ main ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas de análisis
        run: |
          pip install ruff bandit safety

      - name: Validar conflictos de dependencias (pip check)
        run: |
          if [ -f bimbam-buy-ai-agent/requirements.txt ]; then
            pip install -r bimbam-buy-ai-agent/requirements.txt
            pip check
          fi

      - name: Validar resolución de dependencias (dry-run)
        run: |
          if [ -f bimbam-buy-ai-agent/requirements.txt ]; then
            pip install -r bimbam-buy-ai-agent/requirements.txt --dry-run
          fi

      - name: Revisar estilo y sintaxis (Ruff)
        run: |
          ruff check bimbam-buy-ai-agent/

      - name: Escaneo de Seguridad en Código (Bandit)
        run: |
          bandit -r bimbam-buy-ai-agent/ --exclude bimbam-buy-ai-agent/tests

      - name: Escaneo de Vulnerabilidades en Dependencias (Safety)
        run: |
          if [ -f bimbam-buy-ai-agent/requirements.txt ]; then
            safety check -r bimbam-buy-ai-agent/requirements.txt || echo "⚠️ Se encontraron advertencias en dependencias."
          fi
