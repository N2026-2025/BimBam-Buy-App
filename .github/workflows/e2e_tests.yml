name: CI - Pruebas E2E (Streamlit)
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          cd bimbam-buy-ai-agent
          pip install -r requirements.txt
          pip install playwright pytest pytest-playwright

      - name: Validar conflictos de dependencias (pip check)
        run: |
          cd bimbam-buy-ai-agent
          pip check

      - name: Validar resolución de dependencias (dry-run)
        run: |
          cd bimbam-buy-ai-agent
          pip install -r requirements.txt --dry-run

      - name: Instalar navegador Chromium y dependencias de sistema
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Levantar Streamlit en segundo plano
        run: |
          cd bimbam-buy-ai-agent
          nohup streamlit run streamlit_app.py --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501 >/dev/null 2>&1; then
              echo "Streamlit listo"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit no estuvo listo a tiempo:" >&2
          cat streamlit.log >&2
          exit 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Ejecutar Tests E2E con Playwright
        run: |
          cd bimbam-buy-ai-agent
          pytest tests/test_interfaz_e2e.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
