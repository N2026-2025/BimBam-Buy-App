[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bimbam-architecture-review"
version = "1.0.0"
description = "BimBam Buy AI Agent Architecture Review Tool - Analyzes system architecture against software engineering and AI engineering principles from PDF documents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "BimBam Buy Team", email = "team@bimbam-buy.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pypdf>=3.0.0",
    "pdfminer.six>=20231228",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    "spacy>=3.7.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "aiofiles>=23.2.0",
    "watchfiles>=0.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "pre-commit>=3.6.0"
]
pdf = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.0"
]
ml = [
    "sentence-transformers>=3.0.0",
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "scikit-learn>=1.3.0"
]

[project.scripts]
bimbam-architecture-review = "bimbam_architecture_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bimbam_architecture_review*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RUF", "ASYNC", "LOG"]
ignore = ["S101", "S106", "S311", "S603", "S607"]
per-file-ignores = {
    "tests/*": ["S101", "S106", "S311"]
}

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "\\.pyi?$"
exclude = '''
/(
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true